<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; style-src 'self'">
<title>Grabbly</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top drag">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16"/></svg></div>
      <div class="brand-text"><b>Grabbly</b><span>Media downloader</span></div>
    </div>
    <div class="top-actions nodrag">
      <button id="login" class="chip"><i class="dot"></i><span id="loginLabel">Log in to Instagram</span></button>
    </div>
  </header>

  <section class="search">
    <label class="field url">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>
      <input id="url" type="text" placeholder="Paste a profile, post, reel or story link, e.g. instagram.com/username" spellcheck="false">
    </label>
    <label class="field num" title="How many posts to load">
      <span>Max</span>
      <input id="limit" type="number" min="1" max="2000" value="30">
    </label>
    <button id="load" class="primary">Load</button>
  </section>

  <section class="filters">
    <div class="seg" id="source" role="group" aria-label="Source">
      <span class="seg-label">Load</span>
      <button data-v="all" class="on">All</button>
      <button data-v="posts">Posts</button>
      <button data-v="reels">Reels</button>
      <button data-v="stories">Stories</button>
    </div>
    <div class="seg" id="mediaType" role="group" aria-label="Media type">
      <span class="seg-label">Save</span>
      <button data-v="both" class="on">Photos + Videos</button>
      <button data-v="photos">Photos</button>
      <button data-v="videos">Videos</button>
    </div>
  </section>

  <section class="toolbar">
    <label class="check"><input type="checkbox" id="all"><i></i><span>Select all</span></label>
    <span id="count" class="pill">0 selected</span>
    <button id="clear" class="ghost sm" disabled>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Clear
    </button>
    <span class="spacer"></span>
    <div class="zoom" title="Thumbnail size">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2" opacity=".4"/><rect x="3" y="13" width="8" height="8" rx="2" opacity=".4"/><rect x="13" y="13" width="8" height="8" rx="2" opacity=".4"/></svg>
      <input id="zoom" type="range" min="110" max="320" step="10" value="170">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
    </div>
    <label class="sel">Parallel
      <select id="conc"><option>1</option><option>2</option><option selected>3</option><option>5</option></select>
    </label>
  </section>

  <main id="scroller">
    <div id="empty" class="empty">
      <div class="art">
        <svg viewBox="0 0 120 120" width="120" height="120" fill="none"><rect x="14" y="22" width="68" height="84" rx="14" class="e1"/><rect x="38" y="12" width="68" height="84" rx="14" class="e2"/><path d="M52 70l12-14 10 11 8-9 14 16H52z" class="e3"/><circle cx="82" cy="36" r="6" class="e3"/></svg>
      </div>
      <h2>Pick what to download</h2>
      <p>Paste a link above and hit <b>Load</b>. You'll see every post as a thumbnail (▶ marks videos), tick the ones you want and download photos, videos or both in one go.</p>
    </div>
    <div id="grid"></div>
  </main>

  <footer class="bottom">
    <div class="folder">
      <button id="dir" class="ghost">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        <span id="dirName">Folder</span>
      </button>
      <button id="open" class="ghost sm">Open</button>
    </div>

    <div id="task" class="task" hidden>
      <div class="task-line"><span id="taskText">Working…</span><span id="taskPct"></span></div>
      <div class="meter"><div id="taskBar" class="meter-fill"></div></div>
    </div>
    <button id="cancel" class="x" title="Cancel" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <span id="msg" class="msg"></span>
    <button id="download" class="primary big" disabled>Download selected</button>
  </footer>
</div>
<script src="renderer.js"></script>
</body>
</html>
